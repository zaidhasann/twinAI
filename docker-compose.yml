version: '3.8'

services:
  # MongoDB Database
  mongo:
    image: mongo:7.0
    container_name: twinai-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  # FastAPI Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: twinai-backend
    ports:
      - "8000:8000"
    environment:
      - MONGODB_URL=mongodb://mongo:27017
      - DATABASE_NAME=twinai_db
    depends_on:
      - mongo

  # React Frontend
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: twinai-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  mongo-data:
