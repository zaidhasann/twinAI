<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>TwinAI Digital Twin</title>
  <style>
    body {
      width: 320px;
      margin: 0;
      padding: 16px;
      background: #171b1f;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      padding-bottom: 12px;
      margin-bottom: 14px;
    }
    .title {
      font-size: 15px;
      font-weight: 700;
      color: #8b6fc7;
    }
    .badge {
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 4px;
      background: rgba(126, 214, 165, 0.15);
      color: #7ed6a5;
      font-weight: 600;
    }
    .stat-card {
      background: #232a30;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 10px;
    }
    .label {
      font-size: 11px;
      color: #9ca3af;
      text-transform: uppercase;
      font-weight: 600;
      letter-spacing: 0.5px;
    }
    .val {
      font-size: 20px;
      font-weight: 800;
      margin-top: 4px;
    }
    .btn {
      display: block;
      width: 100%;
      text-align: center;
      background: #8b6fc7;
      color: #ffffff;
      border: none;
      padding: 9px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      box-sizing: border-box;
      margin-top: 8px;
    }
    .btn:hover {
      background: #7a5eb8;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="title">TwinAI Companion</div>
    <div class="badge">v1.0 Live</div>
  </div>

  <div class="stat-card">
    <div class="label">Placement Readiness</div>
    <div class="val" id="readiness-val">78%</div>
  </div>

  <div class="stat-card">
    <div class="label">Top Root-Cause Focus</div>
    <div style="font-size: 13px; font-weight: 700; color: #f4b860; margin-top: 4px;" id="root-focus">
      Recursion Foundations
    </div>
    <div style="font-size: 11px; color: #9ca3af; margin-top: 2px;">
      Blocks Tree DP and DFS State Returns
    </div>
  </div>

  <a href="http://localhost:3000/digital-twin" target="_blank" class="btn">
    Open Full Digital Twin Dashboard ↗
  </a>

  <script src="popup.js"></script>
</body>
</html>
